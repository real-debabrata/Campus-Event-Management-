name: Show signing key fingerprint (SHA-1)
# Firebase needs the SHA-1 of your permanent signing key before Google sign-in works in the APK.
# Run this once. The SHA-1 and SHA-256 appear in the run summary. Nothing is changed or uploaded.
on: workflow_dispatch
jobs:
  show:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Print fingerprints
        env:
          PASS: ${{ secrets.KEYSTORE_PASSPHRASE }}
        run: |
          set -euo pipefail
          [ -n "$PASS" ] || { echo "::error::Secret KEYSTORE_PASSPHRASE is missing."; exit 1; }
          [ -f signing/debug.keystore.gpg ] || { echo "::error::signing/debug.keystore.gpg is missing. Run 'Create signing key (run once)' first."; exit 1; }
          gpg --batch --yes --pinentry-mode loopback --passphrase "$PASS" -o "$RUNNER_TEMP/cem.keystore" -d signing/debug.keystore.gpg
          keytool -list -v -keystore "$RUNNER_TEMP/cem.keystore" -storepass android -alias androiddebugkey > "$RUNNER_TEMP/k.txt"
          SHA1=$(grep -m1 'SHA1:' "$RUNNER_TEMP/k.txt" | sed 's/.*SHA1: *//')
          SHA256=$(grep -m1 'SHA256:' "$RUNNER_TEMP/k.txt" | sed 's/.*SHA256: *//')
          {
            echo "### Your signing key fingerprints"
            echo "Paste the **SHA-1** into Firebase console > Project settings > your Android app > Add fingerprint."
            echo
            echo "- SHA-1: \`$SHA1\`"
            echo "- SHA-256: \`$SHA256\`"
          } | tee -a "$GITHUB_STEP_SUMMARY"
