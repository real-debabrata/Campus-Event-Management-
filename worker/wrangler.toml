# Only needed if you deploy with the Wrangler command line.
# If you use the Cloudflare dashboard (SETUP.md, "Upgrade to 3.2.0"), you do not need this file.
#
#   cd worker
#   npx wrangler kv namespace create OTP_KV        # paste the id it prints below
#   npx wrangler secret put FIREBASE_SA            # then paste the service-account JSON
#   npx wrangler secret put BREVO_API_KEY
#   npx wrangler secret put OTP_PEPPER             # any long random string
#   npx wrangler secret put TURNSTILE_SECRET       # optional
#   npx wrangler deploy

name = "cem-otp"
main = "otp-worker.js"
compatibility_date = "2026-01-01"

[[kv_namespaces]]
binding = "OTP_KV"
id = "PASTE_KV_NAMESPACE_ID_HERE"

[vars]
# Sites allowed to call the Worker: your website, GitHub Pages address, and the Android app (https://localhost).
ALLOWED_ORIGINS = "https://cem.deva.indevs.in,https://YOUR_USERNAME.github.io,https://localhost,capacitor://localhost"
# The sender address you verified in Brevo.
FROM_EMAIL = "you@example.com"
FROM_NAME = "Campus Events"
# Optional: accept only these email domains (comma list). Leave out to accept any real email.
# ALLOWED_EMAIL_DOMAINS = "yourcollege.edu.in"
# Optional: extra throwaway domains to refuse.
# BLOCKED_EMAIL_DOMAINS = ""
