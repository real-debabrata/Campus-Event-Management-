name: Create signing key (run once)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  make:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Generate and encrypt the key
        env:
          PASS: ${{ secrets.KEYSTORE_PASSPHRASE }}
        run: |
          if [ -z "$PASS" ]; then echo "Add the KEYSTORE_PASSPHRASE secret first."; exit 1; fi
          if [ -f signing/debug.keystore.gpg ]; then echo "A key already exists. Not overwriting it."; exit 1; fi
          keytool -genkey -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p signing
          gpg --batch --yes --pinentry-mode loopback --passphrase "$PASS" --symmetric --cipher-algo AES256 -o signing/debug.keystore.gpg debug.keystore
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add signing/debug.keystore.gpg
          git commit -m "Add encrypted signing key"
          git push
